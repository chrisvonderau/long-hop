    progress.maxLevel = clamp(progress.maxLevel|0, 0, 8);
    progress.best = progress.best || {};

  }
  function save(){
    dirty = false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v:1, settings, equipped, owned, progress, lifetime, scores, stats
      }));
    } catch (e) {}
  }
  function load(){
    defaultState();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d || d.v !== 1) return;
      if (d.settings) Object.assign(settings, d.settings);
      if (d.equipped) Object.assign(equipped, d.equipped);
      if (d.owned) {
        owned.skins = Object.assign({ red:true }, d.owned.skins||{});
        owned.chars = Object.assign({ mara:true }, d.owned.chars||{});
        owned.arenas = Object.assign({ centre:true }, d.owned.arenas||{});
      }
      if (d.progress) progress = Object.assign(progress, d.progress);
      if (typeof d.lifetime === 'number') lifetime = d.lifetime;
      if (Array.isArray(d.scores)) scores = d.scores.slice(0, 10);
      if (d.stats) stats = Object.assign(stats, d.stats);
    } catch (e) {}
    sanitize();
  }
  function mark(){ dirty = true; save(); }

  function checkUnlocks(){
    const got = [];
    function give(group, id, label){
      if (owned[group][id]) return;
      let ok = false;
      if (id==='gold') ok = lifetime >= 4000;
      if (id==='storm') ok = progress.maxLevel > 3;
      if (id==='ghost') ok = progress.maxLevel > 6;
      if (id==='ice') ok = !!progress.penguins;
      if (id==='nim') ok = progress.maxLevel > 1;
      if (id==='gus') ok = progress.maxLevel > 5;
      if (id==='sid') ok = !!progress.penguins;
      if (id==='dusk') ok = progress.maxLevel > 2;
      if (id==='moon') ok = progress.maxLevel > 6;
      if (id==='salt') ok = progress.maxLevel > 5;
      if (!ok) return;
      owned[group][id] = true;
      got.push(label);
    }
    give('skins','gold','Golden Hour coat');
    give('skins','storm','Storm Grey coat');
    give('skins','ghost','Ghost Gum coat');
    give('skins','ice','Ice Mirage coat');
    give('chars','nim','Nim the wallaby');
    give('chars','gus','Gus the emu');
    give('chars','sid','Sid the sloth');
    give('arenas','dusk','Dusk Track');
    give('arenas','moon','Billabong Moon');
    give('arenas','salt','Salt Glare');
    if (got.length) {
      got.forEach(t => toasts.push({ text:'Unlocked: ' + t, life:3.2 }));
      mark();
    }
    newly = newly.concat(got);
    return got;
  }

  function midi(n){ return 440 * Math.pow(2, (n - 69) / 12); }
  const THEME = [
    62,0,65,69,74,0,72,69, 65,0,62,0,69,67,65,62,
    64,0,67,72,71,0,69,67, 65,69,67,65,64,62,0,0,
    69,0,74,72,69,65,69,0, 67,65,64,0,62,65,69,67,
    72,0,71,69,67,65,67,69, 65,62,0,65,62,0,0,0
  ];
  const BONUS_THEME = [
    67,71,74,79,76,74,71,67, 69,72,76,74,72,69,67,64,
    71,74,78,76,74,71,69,67, 72,67,71,74,72,67,0,0
  ];
  const CHORDS = [
    [50,53,57],[48,52,55],[46,50,53],[41,45,48],
    [43,46,50],[50,53,57],[48,52,55],[45,48,52]
  ];
  const BONUS_CHORDS = [
    [55,59,62],[53,57,60],[48,52,55],[43,47,50]

  function tone(actx, dest, freq, when, dur, type, gain){
    const o = actx.createOscillator();
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(Math.max(30, freq), when);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(type==='sawtooth' ? 1800 : 2400, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), when + Math.min(0.03, dur*0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.05);
  }
  function noiseBurst(when, dur, gain, bp){
    if (!audio.ctx) return;
    const ctxA = audio.ctx;
    const len = Math.max(1, (dur * ctxA.sampleRate)|0);
    const buf = ctxA.createBuffer(1, len, ctxA.sampleRate);
    const d = buf.getChannelData(0);
    let n = 0;
    for (let i=0;i<len;i++){ n = (n + (Math.random()*2-1)*0.08) * 0.96; d[i] = n * 4; }
    const src = ctxA.createBufferSource();
    src.buffer = buf;
    const f = ctxA.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = bp || 240; f.Q.value = 0.7;
    const g = ctxA.createGain();
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(f); f.connect(g); g.connect(audio.sfx);
    src.start(when); src.stop(when + dur + 0.02);
  }
  function makeWindBuffer(actx){
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    let n = 0;
    for (let i=0;i<len;i++){
      n = (n + (Math.random()*2-1) * 0.02) * 0.985;
      d[i] = n * 3.2;
    }
    return buf;
  }
  function initAudio(){
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const actx = new AC();
    const master = actx.createGain();
    master.gain.value = settings.muted ? 0 : settings.volume;
    master.connect(actx.destination);
    const music = actx.createGain(); music.gain.value = 0.9; music.connect(master);
    const amb = actx.createGain(); amb.gain.value = 0.8; amb.connect(master);
    const sfx = actx.createGain(); sfx.gain.value = 1; sfx.connect(master);
    const wind = actx.createBufferSource();
    wind.buffer = makeWindBuffer(actx);
    wind.loop = true;
    const wf = actx.createBiquadFilter();
    wf.type = 'lowpass'; wf.frequency.value = 500;
    const windG = actx.createGain(); windG.gain.value = 0.0;
    wind.connect(wf); wf.connect(windG); windG.connect(amb);
    wind.start();
    audio = { ctx:actx, master, music, amb, sfx, unlocked:false, wind, windG, step:0, nextT:0, started:false, wf };
  }
  function unlockAudio(){
    try {
      initAudio();
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
      if (audio.ctx) {
        audio.unlocked = true;
        if (!audio.started) { audio.nextT = audio.ctx.currentTime + 0.05; audio.started = true; }
      }
    } catch (e) {}
  }
  function applyVolume(){
    if (!audio.master) return;
    audio.master.gain.value = settings.muted ? 0 : settings.volume;
  }
  function scheduleMusic(){
    if (!audio.ctx || !audio.unlocked) return;
    if (settings.muted || mode==='egg') { audio.nextT = audio.ctx.currentTime; return; }
    const bonusMode = mode==='bonus' || mode==='bonusresult';
    const pattern = bonusMode ? BONUS_THEME : THEME;
    const chords = bonusMode ? BONUS_CHORDS : CHORDS;
    const bpm = bonusMode ? 108 : (player && player.lives===1 && mode==='playing' ? 84 : 96);
    const sp = 60 / bpm / 2;
    const tNow = audio.ctx.currentTime;
    let guard = 0;
    while (audio.nextT < tNow + 0.22 && guard < 8) {
      guard++;
      const step = audio.step;
      const when = audio.nextT;
      const note = pattern[step % pattern.length];
      if (note) tone(audio.ctx, audio.music, midi(note + (bonusMode?0:0)), when, sp * 0.92, 'triangle', bonusMode ? 0.07 : 0.055);
      if (step % 8 === 0) {
        const ch = chords[(step/8) % chords.length | 0];
        ch.forEach(n => tone(audio.ctx, audio.music, midi(n), when, sp*7.2, 'sawtooth', 0.018));
        tone(audio.ctx, audio.music, midi(ch[0]-12), when, sp*7.2, 'sine', 0.05);
      }
      if (!bonusMode && (step % 64 === 0 || step % 64 === 32)) {
        tone(audio.ctx, audio.music, midi(62), when, 0.18, 'sawtooth', 0.04);
        tone(audio.ctx, audio.music, midi(69), when, 0.22, 'sawtooth', 0.035);
        tone(audio.ctx, audio.music, midi(74), when + 0.16, 0.28, 'triangle', 0.04);
      }
      audio.step = (step + 1) % pattern.length;
      audio.nextT += sp;
    }
  }
  function skyId(){
    if (mode==='title' || mode==='bonus' || mode==='shed' || mode==='bonusresult') return arenaSky();
    if (level && level.sky) return level.sky;
    return arenaSky();
  }
  function updateAmbience(dt){
    if (!audio.ctx || !audio.unlocked) return;
    const id = skyId();
    const windTarget = (id==='storm' || id==='wet' || id==='salt') ? 0.22 : (id==='night' ? 0.1 : 0.14);
    if (audio.windG) {
      const g = audio.windG.gain;
      g.value += (windTarget - g.value) * Math.min(1, dt * 2);
    }
    bugT -= dt;
    if (bugT <= 0) {
      bugT = id==='night' ? 0.18 + Math.random()*0.25 : 0.45 + Math.random()*0.7;
      if (!settings.muted) tone(audio.ctx, audio.amb, 2800 + Math.random()*1800, audio.ctx.currentTime, 0.05, 'sine', id==='night'?0.02:0.012);
    }
    birdT -= dt;
    if (birdT <= 0) {
      birdT = 9 + Math.random()*8;
      if (id !== 'night' && !settings.muted) kookaLike(audio.ctx.currentTime);
    }
    thunderT -= dt;
    if (thunderT <= 0) {
      thunderT = (id==='wet' || id==='storm') ? 14 + Math.random()*10 : 28 + Math.random()*16;
      if (!settings.muted) noiseBurst(audio.ctx.currentTime, 1.4, (id==='wet'?0.18:0.07), 70);
      if ((id==='wet') && !settings.reducedFlash && mode==='playing') lightFlash = 1;
    }
  }
  function kookaLike(when){
    const seq = [880, 740, 990, 820, 760, 680, 720, 640, 700, 580, 620, 540];
    seq.forEach((f,i) => tone(audio.ctx, audio.amb, f, when + i*0.07, 0.09, 'triangle', 0.03));
  }
  const sfx = {
    hop(dist){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      tone(audio.ctx, audio.sfx, dist>=3?220:320, t, 0.09, 'triangle', 0.08);
      noiseBurst(t, 0.06, 0.05, 900); },
    land(dist){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      noiseBurst(t, 0.09, dist>=3?0.12:0.07, 180);
      tone(audio.ctx, audio.sfx, dist>=3?90:140, t, 0.12, 'sine', 0.08); },
    die(){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      tone(audio.ctx, audio.sfx, 220, t, 0.3, 'sawtooth', 0.06);
      tone(audio.ctx, audio.sfx, 110, t+0.08, 0.4, 'triangle', 0.07); },
    coin(){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      tone(audio.ctx, audio.sfx, 660, t, 0.08, 'triangle', 0.06);
      tone(audio.ctx, audio.sfx, 880, t+0.07, 0.1, 'triangle', 0.05); },
    power(){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      [523,659,784].forEach((f,i)=>tone(audio.ctx, audio.sfx, f, t+i*0.06, 0.12, 'triangle', 0.06)); },
    near(){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      tone(audio.ctx, audio.sfx, 520, t, 0.08, 'sawtooth', 0.04);
      tone(audio.ctx, audio.sfx, 780, t+0.09, 0.14, 'triangle', 0.05); },
    ui(){ if(!audio.ctx||settings.muted) return; tone(audio.ctx, audio.sfx, 540, audio.ctx.currentTime, 0.05, 'square', 0.03); },
    fanfare(){ if(!audio.ctx||settings.muted) return; const t=audio.ctx.currentTime;
      const ns = [62,62,69,74,72,69];
      const ds = [0.1,0.1,0.22,0.16,0.16,0.42];
      let at = t;
      ns.forEach((n,i)=>{ tone(audio.ctx, audio.sfx, midi(n), at, ds[i], 'sawtooth', 0.05); tone(audio.ctx, audio.sfx, midi(n+12), at, ds[i], 'triangle', 0.03); at += ds[i]*0.85; });
    },
    deny(){ if(!audio.ctx||settings.muted) return; tone(audio.ctx, audio.sfx, 140, audio.ctx.currentTime, 0.08, 'square', 0.03); },
    shield(){ if(!audio.ctx||settings.muted) return; tone(audio.ctx, audio.sfx, 400, audio.ctx.currentTime, 0.18, 'triangle', 0.06); }
  };

  function rumble(ms, weak, strong){
    const entry = { ms:ms|0, weak:+weak||0, strong:+strong||0, at: performance.now() };
    rumbleLog.push(entry);
    if (rumbleLog.length > 16) rumbleLog.shift();
    const gp = activePad;
    if (!gp) return;
    const act = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
    if (!act || typeof act.playEffect !== 'function') return;
    try {
      const ret = act.playEffect('dual-rumble', {
        startDelay: 0,
        duration: clamp(ms|0, 0, 2000),
        weakMagnitude: clamp(+weak||0, 0, 1),
        strongMagnitude: clamp(+strong||0, 0, 1)
      });
      if (ret && typeof ret.catch === 'function') ret.catch(function(){});
    } catch (e) {}
  }
  function celebrate(){
    rumble(70, 0.4, 0.5);
    rumbleQ.push({ in:0.16, ms:70, w:0.5, s:0.65 });
    rumbleQ.push({ in:0.34, ms:130, w:0.75, s:0.9 });
  }
  function pumpRumble(dt){
    for (let i=rumbleQ.length-1;i>=0;i--){
      rumbleQ[i].in -= dt;
      if (rumbleQ[i].in <= 0) {
        const r = rumbleQ[i];
        rumble(r.ms, r.w, r.s);
        rumbleQ.splice(i,1);
      }
    }
  }

  const KEYMAP = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    KeyW:'up', KeyA:'left', KeyS:'down', KeyD:'right',
    Space:'space', ShiftLeft:'shift', ShiftRight:'shift',
    KeyE:'power', Escape:'pause', Tab:'map', KeyY:'map',
    Enter:'confirm', KeyM:'mute',
    KeyI:'p2up', KeyK:'p2down', KeyJ:'p2left', KeyL:'p2right', KeyU:'p2jump', KeyO:'p2charge'
  };
  window.addEventListener('keydown', function(e){
    const a = KEYMAP[e.code];
    if (!a) return;
    if (['up','down','left','right','space','map'].indexOf(a) >= 0) e.preventDefault();
    if (e.repeat) return;
    keys[a] = true;
    edges[a] = true;
    unlockAudio();
    if (a==='mute') { settings.muted = !settings.muted; applyVolume(); mark(); }
  });
  window.addEventListener('keyup', function(e){
    const a = KEYMAP[e.code];
    if (!a) return;

  });

  function triggerFromAxis(v){
    if (v == null || isNaN(v)) return 0;
    if (v < -0.05) return clamp((v + 1) / 2, 0, 1);
    if (v > 0.05) return clamp(v, 0, 1);
    return 0;
  }
  function readCharge(gp){
    let v = gp.buttons[7] ? gp.buttons[7].value : 0;
    const axes = gp.axes || [];
    if (gp.mapping !== 'standard' && axes.length >= 4) {
      v = Math.max(v, triggerFromAxis(axes[2]), triggerFromAxis(axes[3]));
    }
    if (axes.length > 5) v = Math.max(v, triggerFromAxis(axes[5]));
    return clamp(v, 0, 1);
  }
  function readPad(gp, scheme){
    if (!gp) return null;
    const b = function(i){ return gp.buttons[i] ? gp.buttons[i].value : 0; };
    const ax = gp.axes || [];
    scheme = scheme || 'full';
    if (scheme === 'share-p1') {
      return { x: ax[0]||0, y: ax[1]||0, dpadx:0, dpady:0, jump:b(4), back:0, power:0, map:0,
        precision:b(10), charge:b(6), pause:0, scheme:scheme };
    }
    if (scheme === 'share-p2') {
      return { x: ax[2]||0, y: ax[3]||0, dpadx:0, dpady:0, jump:b(5), back:0, power:0, map:0,
        precision:b(11), charge: Math.max(b(7), (ax.length>5?triggerFromAxis(ax[5]):0)), pause:0, scheme:scheme };
    }
    return {
      x: ax[0]||0, y: ax[1]||0,
      dpadx: (b(15)>0.5?1:0) - (b(14)>0.5?1:0),
      dpady: (b(13)>0.5?1:0) - (b(12)>0.5?1:0),
      jump: b(0), back: b(1), power: b(2), map: b(3),
      precision: b(6), charge: readCharge(gp), pause: b(9), scheme:'full'
    };
  }
  function pollPad(){
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null, idx = -1;
    if (list) {
      for (let i=0;i<list.length;i++){
        if (list[i] && list[i].connected) { gp = list[i]; idx = i; break; }
      }
    }
    activePad = gp;
    padIndex = idx;
    if (!gp) { padLive = false; return null; }
    let any = false;
    for (let i=0;i<gp.buttons.length;i++){
      const bt = gp.buttons[i];
      if (bt && (bt.pressed || bt.value > 0.35)) any = true;
    }
    if (any) padLive = true;
    return readPad(gp, 'full');
  }

  function showTouch(){
    if (settings.touch === 'on') return true;
    if (settings.touch === 'off') return false;
    return touchUsed || matchMedia('(pointer: coarse)').matches;
  }
  function touchLayout(){
    const s = clamp(Math.min(view.w, view.h) * 0.09, 46, 68);
    const bottom = view.h - safe.b - 24 - s;
    return {
      stick: { x: safe.l + 28 + s, y: bottom, r: s },
      brace: { x: safe.l + 36 + s * 2.7, y: bottom + s*0.15, r: s * 0.46 },
      hop:   { x: view.w - safe.r - 28 - s, y: bottom + 6, r: s * 0.72 },
      leap:  { x: view.w - safe.r - 40 - s * 2.35, y: bottom - s * 0.95, r: s * 0.78 },
      power: { x: view.w - safe.r - 24 - s * 0.15, y: bottom - s * 2.15, r: s * 0.48 },
      pause: { x: view.w - safe.r - 28, y: safe.t + 26, r: 18 }
    };
  }
  function hitCircle(p, c){ return (p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y) <= c.r*c.r; }
  function posOf(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX - r.left) * (view.w / Math.max(1,r.width)), y:(e.clientY - r.top) * (view.h / Math.max(1,r.height)) };
  }
  function onPointerDown(e){
    e.preventDefault();
    unlockAudio();
    canvas.focus();
    const p = posOf(e);
    if (e.pointerType === 'touch') touchUsed = true;
    pointers[e.pointerId] = { x:p.x, y:p.y, type:e.pointerType, role:null };
    if ((mode==='playing' || mode==='bonus') && showTouch()) {
      const L = touchLayout();
      if (hitCircle(p, L.stick) || (p.x < view.w*0.42 && p.y > view.h*0.55)) {
        pointers[e.pointerId].role = 'stick';
        touch.id = e.pointerId;
        touch.active = true;
        touch.ox = L.stick.x; touch.oy = L.stick.y;
        const dx = (p.x - touch.ox) / L.stick.r;
        const dy = (p.y - touch.oy) / L.stick.r;
        const m = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, m);
        touch.ax = dx / m * k; touch.ay = dy / m * k;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        return;
      }
      if (hitCircle(p, L.hop)) { pointers[e.pointerId].role = 'hop'; edges.touchHop = true; return; }
      if (hitCircle(p, L.leap)) { pointers[e.pointerId].role = 'leap'; touch.leap = true; return; }
      if (hitCircle(p, L.power)) { pointers[e.pointerId].role = 'power'; edges.touchPower = true; return; }
      if (hitCircle(p, L.brace)) { pointers[e.pointerId].role = 'brace'; touch.brace = true; return; }
      if (hitCircle(p, L.pause)) { pointers[e.pointerId].role = 'pause'; edges.pause = true; return; }
    }
    for (let i=ui.hits.length-1;i>=0;i--){
      const h = ui.hits[i];
      if (p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h) {
        ui.sel = i;
        activate(h.id);
        return;
      }
    }
  }
  function onPointerMove(e){
    const p = posOf(e);
    const rec = pointers[e.pointerId];
    if (rec && rec.role==='stick') {
      const L = touchLayout();
      const dx = (p.x - touch.ox) / L.stick.r;
      const dy = (p.y - touch.oy) / L.stick.r;
      const m = Math.hypot(dx, dy) || 1;
      const k = Math.min(1, m);
      touch.ax = (dx / m) * k;
      touch.ay = (dy / m) * k;
      touch.active = true;
    } else if (!rec) {
      for (let i=0;i<ui.hits.length;i++){
        const h = ui.hits[i];
        if (p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h) ui.sel = i;
      }
    }
  }
  function onPointerUp(e){
    const rec = pointers[e.pointerId];
    if (rec && rec.role==='stick' && touch.id===e.pointerId) {
      touch.active = false; touch.ax = 0; touch.ay = 0; touch.id = null;
    }
    if (rec && rec.role==='leap') touch.leap = false;
    if (rec && rec.role==='brace') touch.brace = false;
    delete pointers[e.pointerId];
  }
  canvas.addEventListener('pointerdown', onPointerDown, { passive:false });
  canvas.addEventListener('pointermove', onPointerMove, { passive:false });
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function axisToDir(ax, ay){
    if (Math.hypot(ax, ay) < 0.45) return { x:0, y:0 };
    if (Math.abs(ay) >= Math.abs(ax)) return { x:0, y: ay > 0 ? -1 : 1 };

  function futureItemX(lane, it, delay){

  function landingDanger(x, y, delay){

    if (!lane) return 'void';
    if (lane.k==='void') return 'void';
    if (lane.k==='bank') return 'safe';
    if (lane.k==='gorge' || lane.k==='salt') {
      if (!findPad(lane, x)) return 'void';
    }
    if (lane.k==='flood' && waveHits(lane, x, playT + delay)) return 'hit';
    if (lane.k==='river' || lane.k==='billabong') {
      let on = false, croc = false;
      for (let i=0;i<lane.items.length;i++){
        const it = lane.items[i];
        const fx = futureItemX(lane, it, delay);
        if (it.kind==='log' && Math.abs(x-fx) <= it.w/2 + 0.08) on = true;
        if (it.kind==='croc' && Math.abs(x-fx) < it.w/2 + hitRadius()) croc = true;
      }
      if (croc) return 'hit';
      if (!on) return 'void';
      return 'safe';
    }
    for (let i=0;i<lane.items.length;i++){
      const it = lane.items[i];
      if (it.kind==='log') continue;
      const fx = futureItemX(lane, it, delay);
      if (Math.abs(x - fx) < it.w/2 + hitRadius()) return 'hit';

  }

  function updateHazards(dt){

        const it = lane.items[j];

  function updateStand(dt){

    if (player.riding) {
      if (Math.abs(player.rideOff) > player.riding.w/2 + 0.05) { die('slip'); return; }
      if (player.x < -0.35 || player.x > 8.35) { die('edge'); return; }

    if (lane.k==='gorge' || lane.k==='salt') {
      if (!player.pad || player.pad.gone || Math.abs(player.x - player.pad.x) > player.pad.w/2) {

    if (lane.k==='flood' && waveHits(lane, player.x, playT)) { die('flood'); return; }
    if (lane.k==='dirt' || lane.k==='highway' || lane.k==='cattle' || lane.k==='fire' || lane.k==='storm') {
      if (hazardHit(lane, player.x)) { die('hit'); return; }

    // near-miss edge while standing
    if (lane.items) {
      for (let i=0;i<lane.items.length;i++){
        const it = lane.items[i];

        const g = Math.abs(player.x - it.x) - it.w/2 - hitRadius();

function isMenu(m){

  function clearanceOf(lane, x){
    if (!lane) return 0;
    if (lane.k === 'bank') return 99;
    if (lane.k === 'void') return 0;
    if (lane.k === 'gorge' || lane.k === 'salt') {
      const pads = lane.pads || [];
      let on = false;
      for (let i=0;i<pads.length;i++) if (!pads[i].gone && Math.abs(pads[i].x - x) <= pads[i].w/2) on = true;
      if (!on) return 0;
    }
    let c = 99;
    const items = lane.items || [];
    let hazards = 0;
    for (let i=0;i<items.length;i++){
      const it = items[i];
      if (it.kind === 'log') continue;
      hazards++;
      const g = Math.abs(it.x - x) - it.w/2;
      if (g < c) c = g;
    }
    if (!hazards && lane.k !== 'gorge' && lane.k !== 'salt' && lane.k !== 'void' && lane.k !== 'flood') return 99;
    return c;
  }
  function rivalDecide(view, modeName, personality, memory){
    const base = PERSONALITIES[personality] || PERSONALITIES.pat;
    const ahead = view.lanes[view.y + 1];
    if (!ahead) return { dx:0, dy:0, dist:0, wait:true, reason:'done' };
    let gap = base.gap;
    let leapBias = base.leap;
    if (modeName === 'adaptive') {
      const deaths = (memory && memory.deathByKind && memory.deathByKind[ahead.k]) || 0;
      gap += Math.min(2.2, deaths * 0.45);
      if (memory && typeof memory.leapRate === 'number') leapBias = (leapBias + memory.leapRate) / 2;
    }
    const x = view.x;
    const clear = clearanceOf(ahead, x);
    const lane2 = view.lanes[view.y + 2];
    const maxL = view.maxLeap || 4;
    if (ahead.k === 'void') {
      if (lane2 && lane2.k !== 'void' && clearanceOf(lane2, x) >= gap && maxL >= 2) return { dx:0, dy:1, dist:2, wait:false, reason:'vault' };
      const lane3 = view.lanes[view.y + 3];
      if (lane2 && lane2.k === 'void' && lane3 && clearanceOf(lane3, x) >= gap && maxL >= 3) return { dx:0, dy:1, dist:3, wait:false, reason:'vault3' };
      return { dx:0, dy:0, dist:0, wait:true, reason:'wait', gap:gap };
    }
    if (leapBias > 0.75 && lane2 && clearanceOf(lane2, x) >= gap && clear < gap && maxL >= 2) return { dx:0, dy:1, dist:2, wait:false, reason:'leap' };
    if (clear >= gap) return { dx:0, dy:1, dist:1, wait:false, reason:'hop' };
    const left = clearanceOf(ahead, x - 1);
    const right = clearanceOf(ahead, x + 1);
    if (Math.max(left, right) >= gap && Math.max(left, right) > clear + 0.25) {
      return { dx: left > right ? -1 : 1, dy:0, dist:1, wait:false, reason:'sidestep' };
    }
    return { dx:0, dy:0, dist:0, wait:true, reason:'wait', gap:gap };
  }

  function updateBonus(dt, inp){

    bonus.t += dt;

      if (chargeOn || inp.charge > 0.08) d.power = clamp(Math.max(d.power + dt / 0.55, inp.charge || 0), 0, 1);

        d.booms.push({ t:0, angle:d.angle, power:pwr, hit:{} });

      }
      for (let i=d.booms.length-1;i>=0;i--){
        const b = d.booms[i];

        for (let t=0;t<d.targets.length;t++){
          const tg = d.targets[t];

          if (Math.hypot(pos.x - tg.x, pos.y - tg.y) < tg.r + 12) {

      }
      for (let t=d.targets.length-1;t>=0;t--){
        const tg = d.targets[t];
        tg.y += tg.vy * dt;
        if (tg.y < view.h*0.16 || tg.y > view.h*0.8) tg.vy *= -1;
        if (tg.dead) d.targets.splice(t, 1);
      }
      d.spawn += dt;
      if (d.spawn > 1.15) { d.spawn = 0; boomTarget(d); }
    } else if (bonus.kind === 'surf') {
      if (d.stun > 0) d.stun -= dt;
      if (d.hop > 0) d.hop -= dt;
      if (d.stun <= 0 && d.hop <= 0 && inp.x && inp.x !== d.lastX) {
        d.lane = clamp(d.lane + inp.x, 0, 2);
        d.hop = 0.16;
        sfx.hop(1);
      }
      d.lastX = inp.x;
      d.spawn += dt;
      const rate = 0.62 - Math.min(0.2, bonus.t / 80);
      if (d.spawn > rate) {
        d.spawn = 0;
        const lane = (Math.random()*3)|0;
        const coin = Math.random() < 0.62;
        d.items.push({ lane:lane, y:-30, kind: coin ? 'coin' : 'croc', v: 280 + bonus.t * 3 });
      }
      const py = view.h * 0.72;
      for (let i=d.items.length-1;i>=0;i--){
        const it = d.items[i];
        it.y += it.v * dt;
        if (!it.used && it.y > py - 10 && it.y < py + 28 && it.lane === d.lane && d.stun <= 0) {
          it.used = true;
          if (it.kind === 'coin') { bonus.score += 25; sfx.coin(); }
          else { d.stun = 0.7; bonus.t = Math.min(bonus.time - 0.4, bonus.t + 3); sfx.die(); cam.mag = Math.max(cam.mag, 5); }
        }
        if (it.y > view.h + 40) d.items.splice(i, 1);
      }
    } else if (bonus.kind === 'dash') {
      if (d.stun > 0) d.stun -= dt;
      if (d.hop > 0) d.hop -= dt;
      else if (d.stun <= 0 && (inp.x || inp.y)) {
        const nx = clamp(d.px + inp.x, 0, d.cols - 1);
        const ny = clamp(d.py - inp.y, 0, d.rows - 1);
        if (nx !== d.px || ny !== d.py) {
          d.px = nx; d.py = ny; d.hop = 0.14; sfx.hop(1);
          for (let i=d.coins.length-1;i>=0;i--){
            if (d.coins[i].x === d.px && d.coins[i].y === d.py) {
              d.coins.splice(i, 1);
              bonus.score += 30;
              sfx.coin();
            }
          }
        }
      }
      for (let i=0;i<d.weeds.length;i++){
        const w = d.weeds[i];
        w.t += dt;
        if (w.t > 0.42) {
          w.t = 0;
          w.x = clamp(w.x + w.dx, 0, d.cols - 1);
          if (w.x === 0 || w.x === d.cols - 1 || Math.random() < 0.2) w.dx *= -1;
        }
        if (d.stun <= 0 && w.x === d.px && w.y === d.py) {
          d.stun = 0.55;
          bonus.score = Math.max(0, bonus.score - 20);
          sfx.die();
        }
      }
      if (d.coins.length < 8 && Math.random() < dt * 0.8) d.coins.push({ x:(Math.random()*d.cols)|0, y:(Math.random()*d.rows)|0 });
    } else if (bonus.kind === 'rodeo') {
      if (d.stun > 0) d.stun -= dt;
      d.pulse += dt;
      d.spawn += dt;
      if (d.spawn > 1.15) {
        d.spawn = 0;
        d.cows.push({ lane:(Math.random()*3)|0, x:-1.2, v:1.3+Math.random()*0.6, w:1.15 });
      }
      if (!d.mounted && d.stun <= 0 && inp.y && inp.y !== d.lastY) {
        d.lane = clamp(d.lane - inp.y, 0, 2);
        sfx.hop(1);
      }
      d.lastY = inp.y;
      const phase = (d.pulse % 0.82) / 0.82;
      for (let i=d.cows.length-1;i>=0;i--){
        const c = d.cows[i];
        if (d.mounted !== c) c.x += c.v * dt;
        if (d.mounted === c) {
          c.x += c.v * dt;
          if (inp.jump) {
            if (phase > 0.62 && phase < 0.9) {
              d.streak++;
              bonus.score += 20 + d.streak * 8;
              sfx.coin();
              d.pulse = 0.05;
            } else {
              d.mounted = null;
              d.streak = 0;
              d.stun = 0.45;
              sfx.die();
              cam.mag = Math.max(cam.mag, 4);
            }
          }
        }
        if (c.x > 11) {
          if (d.mounted === c) { bonus.score += 40 + d.streak * 5; d.mounted = null; d.streak = 0; sfx.power(); }
          d.cows.splice(i, 1);
        }
      }
      if (!d.mounted && d.stun <= 0 && inp.jump) {
        for (let i=0;i<d.cows.length;i++){
          const c = d.cows[i];
          if (c.lane === d.lane && Math.abs(c.x - 2.3) < 0.85) { d.mounted = c; sfx.hop(2); break; }
        }
      }
      d.phase = phase;
    }
    if (bonus.t >= bonus.time) finishBonus();
  }
  function boomPos(b){
    const along = Math.sin(Math.min(1, b.t) * Math.PI);
    const dist = 80 + b.power * Math.min(view.w * 0.52, 480);
    const side = Math.sin(b.t * Math.PI * 2) * 34;
    const x0 = view.w * 0.16, y0 = view.h * 0.66;
    return {
      x: x0 + Math.cos(b.angle) * dist * along - Math.sin(b.angle) * side,
      y: y0 + Math.sin(b.angle) * dist * along + Math.cos(b.angle) * side
    };
  }
  function updateEgg(dt, inp){

        player.x = 1;
        player.y = Math.round(player.y);

  function tweak(hit, dir){
    if (!hit) return;
    if (hit.id === 'vol') {
      settings.volume = clamp(Math.round((settings.volume + dir * 0.05) * 20) / 20, 0, 1);
      applyVolume();
      mark();
      sfx.ui();
    }
    if (hit.id === 'L0' || hit.id === 'L1' || hit.id === 'L2') {
      const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      const i = +hit.id.charAt(1);
      let idx = glyphs.indexOf(nameSlots[i]);
      if (idx < 0) idx = 0;

  function updateMenu(dt, inp){

      const kind = BONUS_ORDER[progress.bonusIndex % BONUS_ORDER.length];
      progress.bonusIndex++;
      mark();
      startBonus(kind, level && level.endless ? 'endless' : 'campaign');
      return;
    }
    if (id === 'bonus-go') { bonusContinue(); return; }
    if (id === 'retry') {
      if (pendingScore) commitScore(nameSlots.join(''));

    }
    if (id === 'save-score') { commitScore(nameSlots.join('')); return; }

    }
    if (id === 'clear-scores') { scores = []; mark(); save(); return; }
    if (id === 'mute') { settings.muted = !settings.muted; applyVolume(); mark(); return; }

      settings.touch = q[(q.indexOf(settings.touch) + 1) % 3];

    }
    if (id.indexOf('lv-') === 0) {

      if (i <= progress.maxLevel) beginRun(i);

    }

  function rr(x,y,w,h,r){
    const rad = Math.max(0, Math.min(r, w/2, h/2));
    ctx.beginPath();
    ctx.moveTo(x+rad, y);
    ctx.arcTo(x+w, y, x+w, y+h, rad);
    ctx.arcTo(x+w, y+h, x, y+h, rad);
    ctx.arcTo(x, y+h, x, y, rad);
    ctx.arcTo(x, y, x+w, y, rad);
    ctx.closePath();
  }
  function wrapLines(text, maxW){
    const words = String(text).split(' ');
    const lines = [];
    let line = '';
    for (let i=0;i<words.length;i++){
      const t = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }
  function drawButton(it, on){
    ctx.save();

    ctx.fillStyle = on ? '#F0C48A' : 'rgba(48,20,12,0.9)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = on ? '#6A2C16' : '#E6C48A';
    ctx.stroke();
    ctx.fillStyle = on ? '#3A160C' : '#F6E6C8';
    ctx.font = font(it.h < 40 ? 15 : 18, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.label, it.x + it.w/2, it.y + it.h/2 + 1);
    ctx.restore();
  }
  function layoutList(items, top){
    const rowH = view.h < 560 ? 32 : 44;
    const gap = view.h < 560 ? 5 : 8;
    const w = Math.min(480, view.w - 36);
    const x = (view.w - w) / 2;
    const avail = Math.max(rowH, view.h - top - safe.b - 16);
    const step = rowH + gap;
    if (!items.length) return;
    ui.sel = clamp(ui.sel|0, 0, items.length - 1);
    let scroll = ui.scroll || 0;
    const selTop = ui.sel * step;
    if (selTop < scroll) scroll = selTop;
    if (selTop + rowH > scroll + avail) scroll = selTop + rowH - avail;
    if (scroll < 0) scroll = 0;
    ui.scroll = scroll;
    for (let i=0;i<items.length;i++){
      const y = top + i * step - scroll;
      const rec = { id:items[i].id, label:items[i].label, x:x, y:y, w:w, h:rowH, i:i };
      ui.hits.push(rec);
      if (y + rowH >= top - 4 && y <= top + avail + 2) drawButton(rec, i === ui.sel);
    }
  }

  function el(x,y,rx,ry,fill,rot){

  }
  function eyeAt(x,y,open,pup,skinCol){

      ctx.moveTo(x-4.2,y);
      ctx.quadraticCurveTo(x, y-2.2, x+4.2, y);
      ctx.stroke();

    }
    el(x,y,4.4,h,'#F8F3EA');
    el(x+pup, y+0.3, 2.15, Math.max(0.8, 2.3*open), '#3A2416');
    el(x+pup*0.5, y+0.15, 1.05, Math.max(0.5, 1.15*open), '#100C0A');

  function drawWorld(){

    const yTop = Math.ceil(cam.y + view.h / Math.max(20, m.laneH)) + 1;

    }
    if (player) {

      ctx.fillStyle = 'rgba(50,24,10,' + (0.28 - air*0.12) + ')';
      ctx.beginPath();
      ctx.ellipse(feet.x, ground, m.cell*0.38*(1-air*0.35), m.cell*0.14*(1-air*0.35), 0, 0, Math.PI*2);
      ctx.fill();
      const prev = previewPlan();
      if (prev) {
        const lp = worldPos(prev.plan.x, prev.plan.y, m);

      }
      const blink = player.blink > 0 ? 1 : 0;
      if (player.invuln > 0 && !settings.reducedFlash && Math.sin(anim*24) > 0) ctx.globalAlpha = 0.55;
      else if (player.invuln > 0 && settings.reducedFlash) ctx.globalAlpha = 0.8;
      drawActor(feet.x, ground - player.z, {
        face: player.face, squash: player.squash, size: m.cell*1.55,
        blink: blink, expr: faceNow(), joey: player.joey, kind: hero().kind
      });
      ctx.globalAlpha = 1;
      if (player.shield) {
        ctx.strokeStyle = 'rgba(140,190,240,0.8)';
        ctx.lineWidth = 3;

    particles.forEach(function(p){

    ctx.restore();
    const vg = ctx.createRadialGradient(view.w/2, view.h/2, view.w*0.2, view.w/2, view.h/2, view.w*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');

    ctx.fillStyle = vg;

  function previewPlan(){
    if (mode!=='playing' || !player || player.hop || mapOpen) return null;
    let dir = { x:lastInp.x, y:lastInp.y };
    let dist = 1;
    if (player.charging) {
      dist = chargeToDist(player._lastCharge || lastInp.charge || player.charge || 0);
      if (!dir.x && !dir.y) dir = (lastDir.x||lastDir.y) ? lastDir : {x:0,y:1};
    } else if (!(dir.x || dir.y)) return null;
    const plan = planHop(dir.x, dir.y, dist);
    if (!plan) return null;
    const delay = Math.max(0.16, (0.24 + plan.dist*0.055) * hero().hop);
    return { plan:plan, danger: landingDanger(plan.x, plan.y, delay) };
  }

  function drawTouch(){
    const L = touchLayout();
    function knob(c, label, on){
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
      ctx.fillStyle = on ? 'rgba(240,196,138,0.9)' : 'rgba(40,16,10,0.45)';
      ctx.fill();
      ctx.strokeStyle = '#F0D8B0';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = on ? '#3A160C' : '#F6E6C8';
      ctx.font = fontUI(11, 700);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, c.x, c.y);
    }
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(40,16,10,0.35)';
    ctx.fill();
    ctx.strokeStyle = '#F0D8B0';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(L.stick.x + touch.ax*L.stick.r*0.45, L.stick.y + touch.ay*L.stick.r*0.45, L.stick.r*0.42, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(240,196,138,0.9)';
    ctx.fill();
    knob(L.hop, 'HOP', false);
    knob(L.leap, 'LEAP', touch.leap);
    knob(L.power, 'PWR', false);
    knob(L.brace, 'HOLD', touch.brace);
    knob(L.pause, 'II', false);
    ctx.restore();
  }

  function updateFloats(dt){
    for (let i=floats.length-1;i>=0;i--){
      floats[i].life -= dt;
      floats[i].rise = (floats[i].rise||0) + dt*36;
      if (floats[i].life <= 0) floats.splice(i,1);
    }
    for (let i=toasts.length-1;i>=0;i--){
      toasts[i].life -= dt;
      if (toasts[i].life <= 0) toasts.splice(i,1);

  function updateParticles(dt){
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      p.x += (p.vx||0) * dt * (p.world ? 1 : 1);
      p.y += (p.vy||0) * dt * (p.world ? 0.4 : 1);
      if (p.life <= 0) particles.splice(i,1);
    }
    const cap = qual().particles;
    if (particles.length < cap && Math.random() < 0.35) {
      particles.push({ world:false, x:Math.random()*view.w, y:view.h*0.3+Math.random()*view.h*0.5, vx:18+Math.random()*30, vy:-6, life:1.6, max:1.6, r:1.2, col:'rgba(255,220,180,0.35)' });

  function synthProbe(){
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC) return Promise.resolve(0);
    const actx = new AC(1, 44100, 44100);
    tone(actx, actx.destination, midi(62), 0.05, 0.35, 'triangle', 0.2);
    tone(actx, actx.destination, midi(69), 0.2, 0.3, 'sawtooth', 0.08);
    tone(actx, actx.destination, midi(50), 0.05, 0.7, 'sine', 0.12);
    const buf = actx.createBuffer(1, 22050, 44100);
    const data = buf.getChannelData(0);
    let n = 0;
    for (let i=0;i<data.length;i++){ n = (n + (Math.random()*2-1)*0.02)*0.985; data[i] = n*3; }
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 420;
    const g = actx.createGain();
    g.gain.value = 0.2;
    src.connect(f); f.connect(g); g.connect(actx.destination);
    src.start(0);
    return actx.startRendering().then(function(rendered){
      const ch = rendered.getChannelData(0);
      let s = 0, c = 0;
      for (let i=0;i<ch.length;i+=8){ s += ch[i]*ch[i]; c++; }
      return Math.sqrt(s / Math.max(1, c));
    });
  }

  }
  function onHide(){
    if (document.hidden && (mode==='playing' || mode==='bonus')) {
      pausedFrom = mode;
      mode = 'pause';
      mapOpen = false;
    }
  }
  function frame(now){
    const dt = Math.min(0.05, Math.max(0, (now - (frame.prev||now)) / 1000));
    frame.prev = now;
    try {
      anim += dt;
      const inp = pollInput(dt);
      pumpRumble(dt);
      try { scheduleMusic(); updateAmbience(dt); } catch (err) { audio.error = String(err && err.message || err); }
      if (lightFlash > 0) lightFlash = Math.max(0, lightFlash - dt*3);
      if (bubble) { bubble.life -= dt; if (bubble.life <= 0) bubble = null; }
      if (banterLock > 0) banterLock -= dt;
      cam.mag *= Math.pow(0.045, dt);
      if (cam.mag < 0.15) cam.mag = 0;
      const was = mode;
      if (was === 'playing') updatePlay(dt, inp);
      else if (was === 'bonus') updateBonus(dt, inp);
      else if (was === 'egg') updateEgg(dt, inp);
      else updateMenu(dt, inp);
      updateFloats(dt);
      updateParticles(dt);
      updateFlock(dt);
      if (dirty) { saveT += dt; if (saveT > 2.5) { save(); saveT = 0; } }
      draw();
    } catch (err) {
      console.error(err);
      if (window.__LH) window.__LH.lastError = String(err && err.stack || err);
    }
    requestAnimationFrame(frame);
  }

  load();
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', onHide);
  const api = {
    snapshot: snapshot,
    readPad: readPad,
    rivalDecide: rivalDecide,
    personalities: PERSONALITIES
  };
  if (TEST) {
    api.place = function(x, y){
      if (!player || mode !== 'playing') return;
      player.hop = null;
      player.riding = null;
      player.pad = null;
      player.x = x;
      player.y = y;
      player.z = 0;
      player.invuln = 1.8;
      player.maxY = Math.max(player.maxY, y);
      cam.y = y;
    };
    api.begin = function(i){ beginRun(i|0); };
    api.startBonus = function(k){ startBonus(k, 'shed'); };
    api.endBonus = function(){ finishBonus(); };
    api.nudgeBonus = function(left){ if (bonus) bonus.t = Math.max(0, bonus.time - left); };
    api.setLives = function(n){ if (player) player.lives = n; };
    api.synthProbe = synthProbe;
  }
  window.__LH = api;
  requestAnimationFrame(frame);

})();
</script>
